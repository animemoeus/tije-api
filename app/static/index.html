<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TJ Live Tracking</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #f5f7fa; --panel: #ffffff; --text: #1f2933; --muted: #6b7785; --border: #e2e6eb;
      --accent: #174ca1; --ok: #1b7b3a; --warn: #c27c0e; --err: #c62828;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #11151a; --panel: #1a2027; --text: #e6e9ed; --muted: #94a0ad; --border: #2b333c; --accent: #5b8def; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .app { display: grid; grid-template-columns: 360px 1fr; height: 100%; }
    aside { background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
    header { padding: 14px 16px; border-bottom: 1px solid var(--border); }
    h1 { margin: 0 0 4px; font-size: 17px; }
    .status { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.err { background: var(--err); }
    .controls { padding: 12px 16px; display: grid; gap: 8px; border-bottom: 1px solid var(--border); }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    label { color: var(--muted); font-size: 12px; }
    select, input, button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 10px; }
    button { cursor: pointer; }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .hint { color: var(--muted); font-size: 12px; margin: 0; }
    #routeInput { flex: 1; min-width: 120px; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; max-height: 104px; overflow-y: auto; }
    .rchip { border: 0; border-radius: 4px; padding: 2px 6px; font: 600 12px system-ui, sans-serif; cursor: pointer; }
    .rchip small { font-weight: 400; opacity: .85; margin-left: 3px; }
    .chips.filtering .rchip { opacity: .35; }
    .chips.filtering .rchip.on { opacity: 1; box-shadow: 0 0 0 2px var(--text); }
    button.mini { padding: 1px 6px; font-size: 12px; }
    .routebar { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--border);
      border-radius: 6px; background: var(--bg); font-size: 13px; }
    .routebar[hidden] { display: none; }
    .routebar > div { flex: 1; min-width: 0; }
    .routebar small { color: var(--muted); }
    .routebar.err { border-color: var(--err); color: var(--err); }
    .list { overflow-y: auto; flex: 1; min-height: 0; }
    .empty { padding: 24px 16px; color: var(--muted); text-align: center; }
    .bus { padding: 10px 16px; border-bottom: 1px solid var(--border); cursor: pointer; display: grid; gap: 4px; }
    .bus:hover { background: var(--bg); }
    .bus .top { display: flex; align-items: center; gap: 6px; }
    .chip { border-radius: 4px; padding: 1px 6px; font-weight: 600; font-size: 12px; }
    .type { background: var(--accent); color: #fff; }
    .no { color: var(--muted); font-size: 12px; margin-left: auto; }
    .next { font-size: 13px; } .meta { color: var(--muted); font-size: 12px; }
    #map { height: 100%; width: 100%; }
    .bus-icon { display: flex; align-items: center; justify-content: center; }
    .bus-icon .pin { position: relative; min-width: 30px; padding: 2px 4px; border-radius: 6px; border: 2px solid #fff;
      font: 700 11px system-ui, sans-serif; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
    .bus-icon .arrow { position: absolute; left: 50%; top: 50%; width: 0; height: 0;
      border: 5px solid transparent; border-bottom: 8px solid #174ca1; }
    @media (max-width: 720px) {
      .app { grid-template-columns: 1fr; grid-template-rows: 55% 45%; }
      aside { order: 2; border-right: 0; border-top: 1px solid var(--border); }
      main { order: 1; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <h1>TJ Live Tracking</h1>
      <div class="status"><span id="dot" class="dot"></span><span id="status">Memuat…</span></div>
      <div id="source" class="status" style="margin-top:4px"></div>
    </header>
    <div class="controls">
      <div class="row">
        <label for="radius">Radius</label>
        <select id="radius">
          <option value="0.5">0,5 km</option>
          <option value="1" selected>1 km</option>
          <option value="2">2 km</option>
          <option value="3">3 km</option>
          <option value="5">5 km</option>
          <option value="10">10 km</option>
          <option value="15">15 km</option>
          <option value="20">20 km</option>
        </select>
        <button id="locate">Lokasi saya</button>
        <button id="stopsBtn">Tampilkan halte</button>
      </div>
      <div class="row">
        <label for="routeInput">Jalur</label>
        <input id="routeInput" placeholder="mis. 4, 4D, 1" autocomplete="off" />
        <button id="routeClear">Semua</button>
        <button id="routeShow" title="Gambar jalur yang sedang disaring">Gambar jalur</button>
      </div>
      <div id="routeChips" class="chips"></div>
      <div id="routeBar" class="routebar" hidden><div id="routeInfo"></div><button id="routeHide" class="mini">Tutup</button></div>
      <p class="hint">Klik peta untuk memilih titik pantau. Klik kode jalur untuk menyaring. Tombol <b>Jalur</b> di bus menggambar rute yang akan dilewatinya.</p>
    </div>
    <div id="list" class="list"><div class="empty">Belum ada bus di area ini.</div></div>
  </aside>
  <main><div id="map"></div></main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Same origin as the API by default; override with ?api=http://host:8000
  const API = new URLSearchParams(location.search).get("api") || location.origin;
  const BUS_TTL_MS = 5 * 60 * 1000;

  const state = { lat: -6.1754, lon: 106.8272, radius: 1, buses: new Map(), ws: null, retry: 0, stopsLayer: null, routes: new Set() };
  const $ = (id) => document.getElementById(id);

  // Route filter: exact, case-insensitive codes. Empty set = show every route.
  const normRoute = (c) => String(c ?? "").trim().toUpperCase();
  const parseRoutes = (text) => new Set(String(text || "").split(",").map(normRoute).filter(Boolean));
  const byRoute = (a, b) => a.localeCompare(b, "id", { numeric: true, sensitivity: "base" });
  const visible = (b) => !state.routes.size || state.routes.has(normRoute(b.route_code));
  function loadSavedRoutes() {
    const fromUrl = new URLSearchParams(location.search).get("routes");
    if (fromUrl != null) return parseRoutes(fromUrl);
    try { return parseRoutes(localStorage.getItem("tj.routes")); } catch { return new Set(); }
  }
  state.routes = loadSavedRoutes();

  const map = L.map("map").setView([state.lat, state.lon], 15);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: "&copy; OpenStreetMap contributors",
  }).addTo(map);
  const center = L.marker([state.lat, state.lon]).addTo(map);
  const circle = L.circle([state.lat, state.lon], { radius: 1000, color: "#174ca1", weight: 1, fillOpacity: 0.05 }).addTo(map);
  const busLayer = L.layerGroup().addTo(map);

  function setStatus(text, kind) {
    $("status").textContent = text;
    $("dot").className = "dot " + (kind || "");
  }

  function esc(v) {
    return String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function color(hex, fallback) {
    return /^[0-9a-f]{6}$/i.test(hex || "") ? "#" + hex : fallback;
  }

  function busIcon(b) {
    const bg = color(b.route_color, "#174ca1"), fg = color(b.route_text_color, "#ffffff");
    const rot = Number(b.bearing) || 0;
    const label = String(b.route_code || "?");
    const w = Math.max(36, label.length * 8 + 14);
    return L.divIcon({
      className: "bus-icon", iconSize: [w, 22], iconAnchor: [w / 2, 11],
      html: `<div class="pin" style="background:${bg};color:${fg}">${esc(label)}` +
            // Arrow orbits outside the pin, so it never covers the label.
      `<span class="arrow" style="margin:-${w / 2 + 12}px 0 0 -5px;transform-origin:5px ${w / 2 + 12}px;transform:rotate(${rot}deg)"></span></div>`,
    });
  }

  // "168 m lagi · ETA 2" — upstream sends distance in metres; ETA is often 0 (unknown), so it is shown only when set.
  function nextInfo(b) {
    const parts = [];
    const d = Number(b.estimated_distance_next_stops);
    if (d > 0) parts.push(d >= 1000 ? `${(d / 1000).toFixed(1)} km lagi` : `${Math.round(d)} m lagi`);
    const eta = b.estimated_time_next_stops;
    if (eta && eta !== "0") parts.push(`ETA ${eta}`);
    return parts.join(" · ");
  }

  function popupHtml(b) {
    return `<b>${esc(b.route_code)}</b> ${b.trip_headsign ? "→ " + esc(b.trip_headsign) : ""} · ${esc(b.type)}<br>` +
           `<small>${esc(b.bus_body_no)}</small><br>` +
           `Berikutnya: <b>${esc(b.next_stop_name || "-")}</b><br>${esc(nextInfo(b))}` +
           `<div style="margin-top:6px"><button class="mini showRoute" data-no="${esc(b.bus_body_no)}">Lihat jalur</button></div>`;
  }

  // Markers of filtered-out routes stay in memory but off the map, so toggling the filter is instant.
  function syncMarker(entry) {
    const show = visible(entry.data), on = busLayer.hasLayer(entry.marker);
    if (show && !on) busLayer.addLayer(entry.marker);
    else if (!show && on) busLayer.removeLayer(entry.marker);
  }

  function upsertBus(b) {
    if (b.latitude == null || b.longitude == null) return;
    let entry = state.buses.get(b.bus_body_no);
    if (entry) {
      const old = entry.data;
      entry.data = b; entry.seen = Date.now();
      // Snapshots repeat every bus each second; only touch markers that changed.
      if (old.latitude === b.latitude && old.longitude === b.longitude && old.bearing === b.bearing && old.timestamp === b.timestamp) return;
      entry.marker.setLatLng([b.latitude, b.longitude]).setIcon(busIcon(b)).setPopupContent(popupHtml(b));
      if (state.route && state.route.busNo === b.bus_body_no && state.route.data) redrawRoute();
    } else {
      const marker = L.marker([b.latitude, b.longitude], { icon: busIcon(b) }).bindPopup(popupHtml(b));
      entry = { data: b, marker, seen: Date.now() };
      state.buses.set(b.bus_body_no, entry);
    }
    syncMarker(entry);
  }

  function shownCount() {
    let n = 0;
    for (const x of state.buses.values()) if (visible(x.data)) n++;
    return n;
  }

  function liveStatus() {
    const total = state.buses.size;
    return state.routes.size ? `Live · ${shownCount()} dari ${total} bus (jalur ${[...state.routes].sort(byRoute).join(", ")})` : `Live · ${total} bus`;
  }

  function renderChips() {
    const counts = new Map();
    for (const { data: b } of state.buses.values()) {
      const code = normRoute(b.route_code);
      if (!code) continue;
      const c = counts.get(code) || { code: String(b.route_code).trim(), bg: color(b.route_color, "#174ca1"), fg: color(b.route_text_color, "#ffffff"), n: 0 };
      c.n++; counts.set(code, c);
    }
    // Keep selected routes visible as chips even when no bus of that route is in the area right now.
    for (const code of state.routes) if (!counts.has(code)) counts.set(code, { code, bg: "#6b7785", fg: "#ffffff", n: 0 });
    const chips = [...counts.entries()].sort((a, b) => byRoute(a[1].code, b[1].code));
    $("routeChips").classList.toggle("filtering", state.routes.size > 0);
    $("routeChips").innerHTML = chips.map(([key, c]) =>
      `<button class="rchip${state.routes.has(key) ? " on" : ""}" data-route="${esc(key)}" style="background:${c.bg};color:${c.fg}"` +
      ` title="${c.n} bus jalur ${esc(c.code)}">${esc(c.code)}<small>${c.n}</small></button>`).join("");
  }

  function applyRoutes(routes) {
    state.routes = routes;
    $("routeInput").value = [...routes].sort(byRoute).join(", ");
    try { localStorage.setItem("tj.routes", $("routeInput").value); } catch {}
    for (const entry of state.buses.values()) syncMarker(entry);
    if (state.ws && state.ws.readyState === 1) setStatus(liveStatus(), "ok");
    renderList();
  }

  $("routeChips").addEventListener("click", (e) => {
    const chip = e.target.closest(".rchip");
    if (!chip) return;
    const next = new Set(state.routes);
    next.has(chip.dataset.route) ? next.delete(chip.dataset.route) : next.add(chip.dataset.route);
    applyRoutes(next);
  });
  $("routeInput").addEventListener("change", (e) => applyRoutes(parseRoutes(e.target.value)));
  $("routeInput").addEventListener("keydown", (e) => { if (e.key === "Enter") applyRoutes(parseRoutes(e.target.value)); });
  $("routeClear").addEventListener("click", () => applyRoutes(new Set()));
  $("routeInput").value = [...state.routes].sort(byRoute).join(", ");

  function clearBuses() {
    busLayer.clearLayers();
    state.buses.clear();
  }

  // Large radii carry thousands of buses: the map shows all of them, the list only the nearest ones.
  const LIST_LIMIT = 200;

  function km(d) {
    return d == null ? "" : d < 1 ? `${Math.round(d * 1000)} m` : `${d.toFixed(1)} km`;
  }

  // Coalesce list redraws: updates arrive one bus at a time, often thousands per poll.
  function scheduleList() {
    if (state.listTimer) return;
    state.listTimer = setTimeout(() => {
      state.listTimer = null;
      renderList();
      if (state.ws && state.ws.readyState === 1) setStatus(liveStatus(), "ok");
    }, 400);
  }

  function renderList() {
    renderChips();
    const items = [...state.buses.values()].map((x) => x.data).filter(visible)
      .sort((a, b) => (a.distance_km ?? 0) - (b.distance_km ?? 0));
    if (!items.length) {
      $("list").innerHTML = state.routes.size && state.buses.size
        ? `<div class="empty">Tidak ada bus jalur ${esc([...state.routes].sort(byRoute).join(", "))} di area ini.</div>`
        : '<div class="empty">Belum ada bus di area ini.</div>';
      return;
    }
    const shown = items.slice(0, LIST_LIMIT);
    const note = items.length > LIST_LIMIT
      ? `<div class="empty">Menampilkan ${LIST_LIMIT} bus terdekat dari ${items.length}. Semua bus tetap tampil di peta.</div>`
      : "";
    $("list").innerHTML = shown.map((b) => {
      const bg = color(b.route_color, "#174ca1"), fg = color(b.route_text_color, "#ffffff");
      const dist = km(b.distance_km);
      return `<div class="bus" data-no="${esc(b.bus_body_no)}">
        <div class="top"><span class="chip" style="background:${bg};color:${fg}">${esc(b.route_code || "?")}</span>
          <span class="chip type">${esc(b.type)}</span>${b.trip_headsign ? `<span>→ ${esc(b.trip_headsign)}</span>` : ""}
          <span class="no">${esc(b.bus_body_no)}</span>
          <button class="mini showRoute" data-no="${esc(b.bus_body_no)}" title="Gambar jalur yang akan dilewati">Jalur</button></div>
        <div class="next">Berikutnya: <b>${esc(b.next_stop_name || "-")}</b></div>
        <div class="meta">${esc([nextInfo(b), dist ? dist + " dari titik" : ""].filter(Boolean).join(" · "))}</div>
      </div>`;
    }).join("") + note;
  }

  $("list").addEventListener("click", (e) => {
    const el = e.target.closest(".bus");
    const entry = el && state.buses.get(el.dataset.no);
    if (entry) { map.panTo(entry.marker.getLatLng()); entry.marker.openPopup(); }
  });

  // ---- Route lines (GET /routes/{code}) ----------------------------------
  // state.route = {codes, busNo, bus, data} for what is drawn; null when nothing is.
  const routeLayer = L.layerGroup().addTo(map);
  const routeCache = new Map(); // code -> Promise<route>
  const MAX_ROUTES_DRAWN = 6;

  function fetchRoute(code) {
    if (!routeCache.has(code)) {
      const p = fetch(new URL("/routes/" + encodeURIComponent(code), API)).then(async (res) => {
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.detail || `HTTP ${res.status}`);
        return body;
      });
      p.catch(() => routeCache.delete(code)); // Let a failed fetch be retried.
      routeCache.set(code, p);
    }
    return routeCache.get(code);
  }

  // Flat projection in metres around lat0; accurate enough at city scale.
  const xy = (p, lat0) => [p[1] * 111320 * Math.cos(lat0 * Math.PI / 180), p[0] * 110540];

  // Nearest point to p on segments path[from..to]: {i: segment start, pt: [lat, lon], d: metres}.
  function nearestOnPath(path, p, from = 0, to = path.length - 1) {
    const P = xy(p, p[0]);
    let best = { i: Math.max(0, from), pt: path[Math.max(0, from)] || p, d: Infinity };
    for (let i = Math.max(0, from); i < Math.min(to, path.length - 1); i++) {
      const A = xy(path[i], p[0]), B = xy(path[i + 1], p[0]);
      const dx = B[0] - A[0], dy = B[1] - A[1], len = dx * dx + dy * dy;
      const t = len ? Math.max(0, Math.min(1, ((P[0] - A[0]) * dx + (P[1] - A[1]) * dy) / len)) : 0;
      const d = Math.hypot(P[0] - A[0] - t * dx, P[1] - A[1] - t * dy);
      if (d < best.d) best = { i, d, pt: [path[i][0] + t * (path[i + 1][0] - path[i][0]), path[i][1] + t * (path[i + 1][1] - path[i][1])] };
    }
    return best;
  }

  // Path segment of each stop, in travel order. Loop routes run along the same street twice, so each stop is
  // searched only after the previous one, and the first segment within 40 m wins over a closer one further on.
  function stopSegments(dir) {
    if (dir._seg) return dir._seg;
    let from = 0;
    dir._seg = dir.stops.map((s) => {
      const p = [s.lat, s.lon];
      let best = nearestOnPath(dir.path, p, from);
      for (let i = from; i < dir.path.length - 1; i++) {
        const n = nearestOnPath(dir.path, p, i, i + 1);
        if (n.d < 40) { best = n; break; }
      }
      return (from = best.i);
    });
    return dir._seg;
  }

  const lc = (s) => String(s ?? "").trim().toLowerCase();
  // "Blok M Jalur 1" names the stop "Blok M": match either way round.
  const sameStop = (a, b) => !!a && !!b && (lc(a).startsWith(lc(b)) || lc(b).startsWith(lc(a)));
  const nextStopId = (bus) => String(bus.next_stops || "").split("-")[0];
  const stopIndex = (dir, pred, from = 0) => { const i = dir.stops.slice(from).findIndex(pred); return i < 0 ? -1 : i + from; };

  function segBearing(path, i) {
    const a = path[i], b = path[Math.min(i + 1, path.length - 1)], A = xy(a, a[0]), B = xy(b, a[0]);
    return (Math.atan2(B[0] - A[0], B[1] - A[1]) * 180 / Math.PI + 360) % 360;
  }

  // Direction the bus is driving. Buses often run short trips (trip_id 1-P28 → "Monumen Nasional") that match
  // neither route trip_id, and both directions share stop codes, so score each direction on: previous stop before
  // the next one, destination still ahead, heading along the path, and distance to the path.
  function pickDirection(route, bus) {
    const dirs = route.directions, pos = [bus.latitude, bus.longitude];
    if (dirs.length < 2) return dirs[0];
    const exact = dirs.find((d) => d.trip_id && lc(d.trip_id) === lc(bus.trip_id));
    if (exact) return exact;
    const id = nextStopId(bus), heading = Number(bus.bearing);
    const score = (d) => {
      let s = 0;
      const k = stopIndex(d, (x) => x.stop_id === id);
      const p = stopIndex(d, (x) => lc(x.name) === lc(bus.prev_stop_name));
      const h = stopIndex(d, (x) => sameStop(x.name, bus.trip_headsign), Math.max(k, 0));
      if (k >= 0 && p >= 0) s += p < k ? 2 : -2;
      if (bus.trip_headsign) s += h >= 0 ? 1 : -1;
      if (sameStop(d.headsign, bus.trip_headsign)) s += 2;
      const near = nearestOnPath(d.path, pos);
      if (heading && near.d < 100) {
        const diff = Math.abs(((segBearing(d.path, near.i) - heading) % 360 + 540) % 360 - 180);
        s += diff < 60 ? 1.5 : diff > 120 ? -1.5 : 0;
      }
      return s - near.d / 1000;
    };
    return dirs.map((d) => [score(d), d]).sort((a, b) => b[0] - a[0])[0][1];
  }

  // Where the bus is along a direction: {near: nearest point on the path, next: index of the next stop,
  // end: index of the last stop of this trip (its headsign, else the end of the route), endPt: that stop on the path}.
  function progress(dir, bus) {
    const pos = [bus.latitude, bus.longitude], seg = stopSegments(dir);
    const id = nextStopId(bus);
    let next = id ? dir.stops.findIndex((s) => s.stop_id === id) : -1;
    let near;
    if (next >= 0) {
      // Known next stop: the bus is between the previous stop and that one.
      near = nearestOnPath(dir.path, pos, next > 0 ? seg[next - 1] : 0, seg[next] + 1);
    } else {
      near = nearestOnPath(dir.path, pos);
      next = seg.findIndex((i) => i > near.i);
      if (next < 0) next = dir.stops.length;
    }
    let end = stopIndex(dir, (s) => sameStop(s.name, bus.trip_headsign), Math.min(next, dir.stops.length));
    if (end < 0) end = dir.stops.length - 1;
    const s = dir.stops[end];
    const endAt = s ? nearestOnPath(dir.path, [s.lat, s.lon], seg[end], seg[end] + 1) : null;
    return { near, next, end, endAt };
  }

  // Path from the bus to the end of its trip.
  function aheadPath(dir, prog) {
    const { near, endAt } = prog;
    if (!endAt || endAt.i < near.i) return [near.pt, ...dir.path.slice(near.i + 1)];
    return [near.pt, ...dir.path.slice(near.i + 1, endAt.i + 1), endAt.pt];
  }

  function drawRoutes(routes, bus) {
    routeLayer.clearLayers();
    const bounds = L.latLngBounds([]);
    let info = null;
    for (const r of routes) {
      const c = color(r.route_color, "#174ca1");
      const dirs = bus ? [pickDirection(r, bus)] : r.directions;
      const seen = new Set();
      for (const d of dirs) {
        const prog = bus ? progress(d, bus) : null;
        if (prog) info = { route: r, dir: d, prog };
        // Whole direction; with a bus, faded, plus the part still ahead of the bus drawn thick on top.
        L.polyline(d.path, { color: c, weight: prog ? 4 : 5, opacity: prog ? 0.35 : 0.8, interactive: false }).addTo(routeLayer);
        if (prog) L.polyline(aheadPath(d, prog), { color: c, weight: 7, opacity: 0.95, interactive: false }).addTo(routeLayer);
        d.path.forEach((p) => bounds.extend(p));
        d.stops.forEach((s, k) => {
          if (seen.has(s.stop_id)) return;
          seen.add(s.stop_id);
          // Faded: already passed, or beyond where this trip ends.
          const passed = prog && (k < prog.next || k > prog.end);
          const left = prog && !passed ? ` · ${k - prog.next + 1} halte lagi` : "";
          L.circleMarker([s.lat, s.lon], { radius: 5, color: c, weight: 2, fillColor: "#fff", fillOpacity: passed ? 0.4 : 1,
            opacity: passed ? 0.4 : 1, bubblingMouseEvents: false })
            .bindPopup(`<b>${esc(s.name)}</b><br>${esc(r.route_code)} → ${esc(d.headsign || "-")} · halte ${k + 1}/${d.stops.length}${left}`)
            .addTo(routeLayer);
        });
      }
    }
    return { bounds, info };
  }

  function chipHtml(r) {
    return `<span class="chip" style="background:${color(r.route_color, "#174ca1")};color:${color(r.route_text_color, "#ffffff")}">${esc(r.route_code)}</span>`;
  }

  function setRouteBar(html, isError) {
    $("routeBar").hidden = false;
    $("routeBar").classList.toggle("err", !!isError);
    $("routeInfo").innerHTML = html;
  }

  function redrawRoute() {
    const r = state.route, entry = r.busNo && state.buses.get(r.busNo);
    if (entry) r.bus = entry.data; // Keep the last known position when the bus leaves the area.
    const { bounds, info } = drawRoutes(r.data, r.bus);
    if (info) {
      const { route, dir, prog } = info, left = prog.end - prog.next + 1;
      const next = dir.stops[prog.next], dest = dir.stops[prog.end];
      setRouteBar(`${chipHtml(route)} ${esc(route.route_name || "")}<br><small>Bus ${esc(r.bus.bus_body_no)} menuju ` +
        `<b>${esc((dest && dest.name) || dir.headsign || "-")}</b> · ` +
        `${left > 0 && next ? `${left} halte lagi, berikutnya ${esc(next.name)}` : "di akhir rute"}</small>`);
    } else {
      setRouteBar(r.data.map((x) => `${chipHtml(x)} ${esc(x.route_name || "")}`).join("<br>") +
        `<br><small>${r.data.reduce((n, x) => n + x.directions.length, 0)} arah</small>`);
    }
    return bounds;
  }

  async function showRoute(codes, busNo = null) {
    const token = (state.routeToken = (state.routeToken || 0) + 1);
    const entry = busNo && state.buses.get(busNo);
    state.route = { codes, busNo, bus: entry ? entry.data : null, data: null };
    setRouteBar(`Memuat jalur ${esc(codes.join(", "))}…`);
    try {
      const data = await Promise.all(codes.map(fetchRoute));
      if (token !== state.routeToken) return; // Another route was picked meanwhile.
      state.route.data = data;
      const bounds = redrawRoute();
      if (bounds.isValid()) map.fitBounds(bounds, { padding: [30, 30] });
    } catch (err) {
      if (token !== state.routeToken) return;
      routeLayer.clearLayers();
      setRouteBar(`Gagal memuat jalur: ${esc(err.message)}`, true);
    }
  }

  function hideRoute() {
    state.routeToken = (state.routeToken || 0) + 1;
    state.route = null;
    routeLayer.clearLayers();
    $("routeBar").hidden = true;
  }

  function showBusRoute(no) {
    const entry = state.buses.get(no);
    if (!entry || !entry.data.route_code) return;
    map.closePopup();
    showRoute([String(entry.data.route_code).trim()], no);
  }

  // Capture phase: Leaflet popups stop click propagation, and the list's own handler should not also pan.
  document.addEventListener("click", (e) => {
    const btn = e.target.closest && e.target.closest(".showRoute");
    if (!btn) return;
    e.stopPropagation();
    showBusRoute(btn.dataset.no);
  }, true);

  $("routeShow").addEventListener("click", () => {
    const codes = [...state.routes].sort(byRoute);
    if (!codes.length) return setRouteBar("Pilih jalur dulu: ketik kodenya di kolom Jalur atau klik chip.", true);
    showRoute(codes.slice(0, MAX_ROUTES_DRAWN));
  });
  $("routeHide").addEventListener("click", hideRoute);

  function connect() {
    clearTimeout(state.timer);
    if (state.ws) { state.ws.onclose = null; state.ws.close(); }
    clearTimeout(state.listTimer); state.listTimer = null;
    clearBuses(); renderList();
    const url = new URL("/ws", API);
    url.protocol = url.protocol.replace("http", "ws");
    url.search = new URLSearchParams({ lat: state.lat, lon: state.lon, radius_km: state.radius });
    setStatus("Menghubungkan…", "warn");
    const ws = new WebSocket(url);
    state.ws = ws;
    let serverError = "";
    ws.onopen = () => setStatus("Terhubung, menunggu posisi bus…", "ok");
    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.type === "error") { serverError = msg.detail; setStatus("Error: " + msg.detail, "err"); return; }
      if (msg.type !== "snapshot") return;
      // Each snapshot is the full set of buses in the radius: add/move those in it, drop the rest.
      state.retry = 0;
      const keep = new Set(msg.buses.map((b) => b.bus_body_no));
      for (const [no, x] of state.buses) if (!keep.has(no)) { busLayer.removeLayer(x.marker); state.buses.delete(no); }
      msg.buses.forEach(upsertBus);
      scheduleList();
    };
    ws.onclose = () => {
      // Back off exponentially; after a server-side error wait at least 15 s so we do not hammer upstream.
      const base = Math.min(60000, 1000 * 2 ** state.retry++);
      const wait = serverError ? Math.max(15000, base) : base;
      const why = serverError ? `Error: ${serverError.slice(0, 120)} · ` : "Terputus · ";
      setStatus(`${why}coba lagi dalam ${Math.round(wait / 1000)} dtk…`, "err");
      clearTimeout(state.timer);
      state.timer = setTimeout(connect, wait);
    };
  }

  function setCenter(lat, lon) {
    // Same bounds the API enforces (LAT/LON in app/main.py).
    if (lat < -7.5 || lat > -5.5 || lon < 106 || lon > 107.5) return setStatus("Titik di luar area Jakarta", "warn");
    state.lat = +lat.toFixed(6); state.lon = +lon.toFixed(6);
    center.setLatLng([state.lat, state.lon]);
    circle.setLatLng([state.lat, state.lon]);
    if (state.stopsLayer) loadStops();
    connect();
  }

  async function loadStops() {
    if (state.stopsLayer) state.stopsLayer.remove();
    state.stopsLayer = L.layerGroup().addTo(map);
    const qs = new URLSearchParams({ lat: state.lat, lon: state.lon, radius_km: state.radius });
    try {
      const res = await fetch(new URL("/stops?" + qs, API));
      if (!res.ok) throw new Error((await res.json()).detail || res.status);
      const data = await res.json();
      const stops = Array.isArray(data) ? data : (data?.items || data?.data || []);
      stops.forEach((s) => {
        const lat = +(s.stop_lat ?? s.latitude), lon = +(s.stop_lon ?? s.longitude);
        if (!lat || !lon) return;
        L.circleMarker([lat, lon], { radius: 5, color: "#174ca1", weight: 2, fillColor: "#fff", fillOpacity: 1 })
          .bindPopup(`<b>${esc(s.stop_name)}</b><br>${esc(s.bus_stop_type === "halte" ? "Halte" : "Bus stop")}`)
          .addTo(state.stopsLayer);
      });
      $("stopsBtn").textContent = `Sembunyikan halte (${stops.length})`;
    } catch (err) {
      setStatus("Gagal memuat halte: " + err.message, "err");
    }
  }

  $("stopsBtn").addEventListener("click", () => {
    if (state.stopsLayer) {
      state.stopsLayer.remove(); state.stopsLayer = null;
      $("stopsBtn").textContent = "Tampilkan halte";
    } else loadStops();
  });

  $("radius").addEventListener("change", (e) => {
    state.radius = +e.target.value;
    circle.setRadius(state.radius * 1000);
    map.fitBounds(circle.getBounds(), { padding: [20, 20] });
    if (state.stopsLayer) loadStops();
    connect();
  });

  $("locate").addEventListener("click", () => {
    if (!navigator.geolocation) return setStatus("Browser tidak mendukung GPS", "err");
    navigator.geolocation.getCurrentPosition(
      (p) => { map.setView([p.coords.latitude, p.coords.longitude], 15); setCenter(p.coords.latitude, p.coords.longitude); },
      (err) => setStatus("Lokasi tidak tersedia: " + err.message, "err"),
    );
  });

  map.on("click", (e) => setCenter(e.latlng.lat, e.latlng.lng));

  // Drop buses that stopped reporting, like the app does after 5 minutes.
  setInterval(() => {
    const now = Date.now();
    for (const [no, x] of state.buses) {
      if (now - x.seen > BUS_TTL_MS) { busLayer.removeLayer(x.marker); state.buses.delete(no); }
    }
    renderList();
  }, 30000);

  // Data source + upstream identity, refreshed every 30 s.
  async function refreshSource() {
    try {
      const h = await (await fetch(new URL("/health", API))).json();
      const who = h.auth.logged_in_as === "user" ? `akun ${h.auth.email}` : h.auth.logged_in_as || "belum login";
      const src = `polling REST tiap ${h.tracker.poll_seconds} dtk`;
      $("source").textContent = `Sumber: ${src} · ${who}${h.auth.last_error ? " · ⚠ " + h.auth.last_error.slice(0, 80) : ""}`;
    } catch {
      $("source").textContent = "API tidak bisa dihubungi";
    }
  }
  refreshSource();
  setInterval(refreshSource, 30000);
  connect();
</script>
</body>
</html>
